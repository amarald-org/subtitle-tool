[project]
name = "subtitle-tool"
version = "0.0.1"
description = "Find, sync and translate movie subtitles into stacked English + Finnish"
readme = "README.md"
authors = [
    { name = "amarald", email = "hei@amarald.io" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "deep-translator>=1.11.4",
    "ffsubsync>=0.5.1",
    "numpy>=2.5.3",
    "requests>=2.34.2",
    "srt>=3.5.3",
]

[project.optional-dependencies]
offline = ["argostranslate>=1.9"]
gui = [
    "pyobjc-framework-cocoa>=10; sys_platform == 'darwin'",
    "pyside6-addons>=6.11.2",
]
auto = [
    "faster-whisper>=1.2.1",
]

[project.scripts]
subtitle-tool = "subtitle_tool:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []

[tool.uv]
# argostranslate pins stanza==1.10.1, which has a pickle RCE (GHSA-v5jw-96jm-7h2c).
# Force the patched release until argostranslate updates its pin.
override-dependencies = ["stanza>=1.12.2"]
